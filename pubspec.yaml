name: github_explorer
description: Main workspace definition for project
publish_to: none
version: 0.0.1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dynamic_path_url_strategy: any
  flutter_riverpod: any
  app:
    path: app

dev_dependencies:
  melos: ^6.3.3
  build_runner: ^2.5.3
  flutter_lints: any
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true