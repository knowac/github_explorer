name: app
description: Main app for integration and running functionalities
publish_to: 'none'

version: 0.0.1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../packages/core
  repo_search:
    path: ../packages/features/repo_search
  repo_details:
    path: ../packages/features/repo_details
  display_errors:
    path: ../packages/features/display_errors
  display_main_scaffold:
    path: ../packages/features/display_main_scaffold
  flutter_riverpod: ^2.6.1
  go_router: ^15.2.3
  riverpod_annotation: any
  dynamic_path_url_strategy: any
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.3
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true